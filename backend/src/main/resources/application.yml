spring:
  application:
    name: pose-backend
  datasource:
    url: ${POSE_DATABASE_URL:jdbc:postgresql://localhost:5432/pose}
    username: ${POSE_DATABASE_USERNAME:pose}
    password: ${POSE_DATABASE_PASSWORD:pose}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/baseline,classpath:db/migration

server:
  port: ${PORT:8080}

pose:
  kpi:
    lead-response-sla-hours: ${POSE_KPI_LEAD_RESPONSE_SLA_HOURS:24}
    opportunity-idle-days: ${POSE_KPI_OPPORTUNITY_IDLE_DAYS:14}
  ai:
    enabled: ${POSE_AI_ENABLED:false}
    provider: ${POSE_AI_PROVIDER:mock}
    api-key: ${POSE_AI_API_KEY:}
    monthly-budget-usd: ${POSE_AI_MONTHLY_BUDGET_USD:5}
    timeout-seconds: ${POSE_AI_TIMEOUT_SECONDS:30}
    max-retries: ${POSE_AI_MAX_RETRIES:1}
    max-tokens: ${POSE_AI_MAX_TOKENS:16000}
    max-context-chars: ${POSE_AI_MAX_CONTEXT_CHARS:12000}
    signal:
      max-messages-per-request: ${POSE_AI_SIGNAL_MAX_MESSAGES:2}
      request-budget-seconds: ${POSE_AI_SIGNAL_REQUEST_BUDGET_SECONDS:25}
    copilot:
      reuse-minutes: ${POSE_AI_COPILOT_REUSE_MINUTES:10}
    models:
      signal-extract: ${POSE_AI_MODEL_SIGNAL_EXTRACT:claude-haiku-5-5}
      c360-summary: ${POSE_AI_MODEL_C360_SUMMARY:claude-sonnet-5-5}
      handover-brief: ${POSE_AI_MODEL_HANDOVER_BRIEF:claude-sonnet-5-5}
      reply-draft: ${POSE_AI_MODEL_REPLY_DRAFT:claude-sonnet-5-5}
    effort:
      signal-extract: ${POSE_AI_EFFORT_SIGNAL_EXTRACT:low}
      c360-summary: ${POSE_AI_EFFORT_C360_SUMMARY:medium}
      handover-brief: ${POSE_AI_EFFORT_HANDOVER_BRIEF:medium}
      reply-draft: ${POSE_AI_EFFORT_REPLY_DRAFT:medium}
    pricing:
      haiku-input: ${POSE_AI_HAIKU_INPUT_USD_PER_MILLION:0.10}
      haiku-output: ${POSE_AI_HAIKU_OUTPUT_USD_PER_MILLION:0.50}
      sonnet-input: ${POSE_AI_SONNET_INPUT_USD_PER_MILLION:2.00}
      sonnet-output: ${POSE_AI_SONNET_OUTPUT_USD_PER_MILLION:10.00}
    gemini:
      structured-output: ${POSE_AI_GEMINI_STRUCTURED_OUTPUT:true}
      thinking-level: ${POSE_AI_GEMINI_THINKING_LEVEL:}
      models:
        signal-extract: ${POSE_AI_GEMINI_MODEL_SIGNAL_EXTRACT:gemini-3.6-flash}
        c360-summary: ${POSE_AI_GEMINI_MODEL_C360_SUMMARY:gemini-3.6-flash}
        handover-brief: ${POSE_AI_GEMINI_MODEL_HANDOVER_BRIEF:gemini-3.6-flash}
        reply-draft: ${POSE_AI_GEMINI_MODEL_REPLY_DRAFT:gemini-3.6-flash}
      pricing:
        input: ${POSE_AI_GEMINI_INPUT_USD_PER_MILLION:0}
        output: ${POSE_AI_GEMINI_OUTPUT_USD_PER_MILLION:0}
  channel:
    telegram:
      webhook-secret: ${POSE_CHANNEL_TELEGRAM_WEBHOOK_SECRET:}
      smoke:
        enabled: ${POSE_CHANNEL_TELEGRAM_SMOKE_ENABLED:false}
  workflow:
    worker:
      enabled: ${POSE_WORKFLOW_WORKER_ENABLED:false}
      interval-ms: ${POSE_WORKFLOW_WORKER_INTERVAL_MS:60000}
      batch-size: ${POSE_WORKFLOW_WORKER_BATCH_SIZE:20}
      max-retry: ${POSE_WORKFLOW_WORKER_MAX_RETRY:3}
      due-days: ${POSE_WORKFLOW_WORKER_DUE_DAYS:1}
  security:
    jwt:
      secret-base64: ${POSE_JWT_SECRET_BASE64:}
      access-token-ttl: ${POSE_ACCESS_TOKEN_TTL:15m}
    auth:
      refresh-token-ttl: ${POSE_REFRESH_TOKEN_TTL:7d}
